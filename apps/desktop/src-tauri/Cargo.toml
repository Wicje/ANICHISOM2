[package]
name = "continua-desktop"
version = "0.1.0"
description = "The continuity browser — sessions, logins, and context follow you across machines."
edition = "2021"

[lib]
name = "continua_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
url = "2"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
