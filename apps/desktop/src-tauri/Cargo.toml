[package]
name = "continua-desktop"
version = "0.1.0"
description = "Continua Lite (frozen fallback) — lightweight WebKitGTK browser host for the shared Continua chrome."
edition = "2021"

[lib]
name = "continua_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "3"
url = "2"
reqwest = { version = "0.12", features = ["json"] }
# Feature set mirrors tauri-runtime-wry's own wry dependency so the crate
# unifies into one copy ("protocol" + "os-webview" + "linux-body", no default).
wry = { version = "0.55.1", default-features = false, features = ["protocol", "os-webview", "linux-body"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "2.0" }
soup3 = { version = "0.5", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
