<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab — Continua</title>
<style>
  :root {
    color-scheme: light;
    --blue: #2563eb; --blue-link: #1d4ed8;
    --bg: #e9ecf2; --card: #eef2f7; --text: #1e293b; --muted: #64748b;
    --border: rgba(100, 116, 139, 0.16);
    --sf: -apple-system, "SF Pro Display", "SF Pro Text", "SF Pro Icons", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text); background: var(--bg);
    font-family: var(--sf);
    display: flex; align-items: center; justify-content: center; padding: 44px 20px 64px;
    overflow-x: hidden;
  }
  .ambient { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .grid a { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
  .wrap { width: min(600px, 94vw); text-align: center; position: relative; z-index: 1; }
  .eyebrow {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 2px;
    text-transform: uppercase; color: var(--blue-link);
    border-radius: 980px; padding: 5px 14px; margin-bottom: 18px;
    background: var(--card);
    box-shadow: 4px 4px 9px rgba(156, 171, 197, 0.38), -4px -4px 9px rgba(255, 255, 255, 0.88);
  }
  h1 { font-size: clamp(36px, 6.5vw, 54px); font-weight: 700; letter-spacing: -0.02em;
    margin: 0 0 10px; }
  #clock { color: var(--muted); font-size: 15px; margin-bottom: 24px; font-variant-numeric: tabular-nums; }
  form { display: flex; gap: 8px; background: var(--card);
    border-radius: 980px; padding: 5px 5px 5px 22px;
    box-shadow: 0 16px 36px -4px rgba(152, 168, 196, 0.45), 0 4px 12px -2px rgba(152, 168, 196, 0.22), inset 0 1px 2px rgba(255, 255, 255, 0.95), inset 0 -1px 2px rgba(160, 175, 200, 0.18);
    transition: box-shadow 0.2s; }
  input { flex: 1; background: transparent; border: none; outline: none; color: inherit;
    font: inherit; font-size: 17px; min-width: 0; }
  input::placeholder { color: var(--muted); }
  button.go { border: none; cursor: pointer; border-radius: 980px;
    padding: 11px 26px; min-height: 44px; color: #fff; background: var(--blue);
    font: inherit; font-size: 16px; font-weight: 600;
    box-shadow: 4px 4px 9px rgba(156, 171, 197, 0.38); transition: filter 0.15s; }
  button.go:hover { filter: brightness(1.1); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 12px; margin-top: 30px; }
  .grid a { text-decoration: none; color: inherit; background: var(--card);
    border-radius: 16px; padding: 18px 6px 14px;
    display: flex; flex-direction: column; gap: 9px; align-items: center; font-size: 13px;
    opacity: 0; transform: translateY(10px); animation: rise 0.45s ease-out forwards;
    box-shadow: 0 10px 22px -8px rgba(140, 156, 184, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.9);
    transition: transform 0.15s, box-shadow 0.2s; }
  .grid a:hover { transform: translateY(-3px);
    box-shadow: 0 16px 32px -8px rgba(140, 156, 184, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.9); }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .glyph { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 17px; color: #fff;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2); }
  .appicon { width: 36px; height: 36px; border-radius: 10px; object-fit: cover;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2); background: var(--card); }
  .sect { margin: 26px 0 -18px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--muted); }
  .foot { margin-top: 30px; font-size: 12px; color: var(--muted); }
  .foot kbd { font-family: inherit; font-size: 11px; border-radius: 6px; padding: 1px 7px; background: var(--card);
    box-shadow: 2px 2px 5px rgba(156, 171, 197, 0.35), -2px -2px 5px rgba(255, 255, 255, 0.85); }
  #offline { display: none; margin-top: 14px; font-size: 13px; color: var(--muted); }
  #offline a { color: var(--blue-link); text-decoration: none; }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i></div>
<div class="wrap">
  <span class="eyebrow">Continua</span>
  <h1 id="hello">Where to next?</h1>
  <div id="clock"></div>
  <form id="s">
    <input id="q" placeholder="Search or type a URL" autocomplete="off" spellcheck="false">
    <button class="go" type="submit">Go</button>
  </form>
  <div id="offline">You're offline. Tabs and history are safe — search needs a connection.</div>
  <div id="apps"></div>
  <div class="grid" id="links"></div>
  <p class="foot"><kbd>Ctrl+K</kbd> commands &nbsp;·&nbsp; <kbd>Ctrl+T</kbd> new tab &nbsp;·&nbsp; <kbd>Ctrl+Shift+T</kbd> reopen</p>
</div>
<script>
  // Baked by the host per profile (installed web apps + icons). The page is
  // file:// with no IPC by design — images load straight from the sites.
  window.__CONTINUA_APPS__ = /*__CONTINUA_APPS__*/[];
</script>
<script>
  const hour = new Date().getHours();
  const greet = hour < 5 ? "Up late?" : hour < 12 ? "Good morning" : hour < 18 ? "Good afternoon" : "Good evening";
  document.getElementById("hello").textContent = greet + " — where to next?";
  const clock = () => {
    const d = new Date();
    document.getElementById("clock").textContent =
      d.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }) + " · " +
      d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  };
  clock(); setInterval(clock, 20000);
  const sites = [
    ["GitHub", "https://github.com", "G", "#6e5494"],
    ["YouTube", "https://youtube.com", "Y", "#c4302b"],
    ["Gmail", "https://mail.google.com", "M", "#d93025"],
    ["Drive", "https://drive.google.com", "D", "#188038"],
    ["Calendar", "https://calendar.google.com", "C", "#1a73e8"],
    ["Maps", "https://maps.google.com", "M", "#34a853"],
    ["Reddit", "https://reddit.com", "R", "#ff4500"],
    ["News", "https://news.ycombinator.com", "H", "#ff6600"],
  ];
  const grid = document.getElementById("links");
  // Installed web apps first (host-baked, with site icons + letter fallback).
  try {
    const installed = Array.isArray(window.__CONTINUA_APPS__) ? window.__CONTINUA_APPS__.slice(0, 12) : [];
    if (installed.length) {
      const host = document.getElementById("apps");
      const label = document.createElement("div");
      label.className = "sect";
      label.textContent = "Your apps";
      host.appendChild(label);
      const g = document.createElement("div");
      g.className = "grid";
      installed.forEach((app, i) => {
        if (!app || typeof app.url !== "string" || !/^https?:\/\//i.test(app.url)) return;
        const name = String(app.name || "App").slice(0, 24);
        const a = document.createElement("a");
        a.href = app.url;
        a.title = name;
        a.style.animationDelay = `${Math.min(i * 45, 360)}ms`;
        const label2 = document.createElement("span");
        label2.textContent = name;
        const makeGlyph = () => {
          const glyph = document.createElement("span");
          glyph.className = "glyph";
          glyph.style.background = "#515154";
          glyph.textContent = (name[0] || "A").toUpperCase();
          return glyph;
        };
        if (typeof app.icon === "string" && /^(https?|file):\/\//i.test(app.icon)) {
          const img = document.createElement("img");
          img.className = "appicon";
          img.src = app.icon;
          img.alt = "";
          img.referrerPolicy = "no-referrer";
          img.onerror = () => { img.replaceWith(makeGlyph()); };
          a.appendChild(img);
        } else {
          a.appendChild(makeGlyph());
        }
        a.appendChild(label2);
        g.appendChild(a);
      });
      host.appendChild(g);
    }
  } catch { /* icons are decoration — never break the page */ }
  sites.forEach(([name, url, g, c], i) => {
    const a = document.createElement("a");
    a.href = url;
    a.style.animationDelay = `${Math.min(i * 45, 360)}ms`;
    a.innerHTML = `<span class="glyph" style="background:${c}">${g}</span><span>${name}</span>`;
    grid.appendChild(a);
  });
  const showOffline = () => {
    document.getElementById("offline").style.display = navigator.onLine ? "none" : "block";
  };
  window.addEventListener("online", showOffline);
  window.addEventListener("offline", showOffline);
  showOffline();
  document.getElementById("s").addEventListener("submit", (e) => {
    e.preventDefault();
    const q = document.getElementById("q").value.trim();
    if (!q) return;
    const isUrl = /^https?:\/\//i.test(q) || (/^\S+\.\S{2,}/.test(q) && !/\s/.test(q));
    location.href = isUrl ? (/^https?:\/\//i.test(q) ? q : "https://" + q)
                          : "https://www.google.com/search?q=" + encodeURIComponent(q);
  });
  document.getElementById("q").focus();
</script>
</body>
</html>
