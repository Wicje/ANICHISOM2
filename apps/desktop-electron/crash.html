<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tab ran out of memory — Continua</title>
<style>
  :root { color-scheme: light dark; --blue: #0071e3; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #f5f5f7; color: #1d1d1f;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; padding: 24px; }
  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #f5f5f7; }
    .card { background: #161617; border-color: #2c2c2e; }
    p { color: #86868b; }
  }
  .card { max-width: 460px; text-align: center; background: #fff;
    border: 1px solid #e5e7eb; border-radius: 8px; padding: 32px 28px; }
  h1 { font-size: 24px; font-weight: 600; margin: 0 0 8px; }
  p { color: #6e6e73; font-size: 15px; word-break: break-all; }
  .row { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
  button { cursor: pointer; border-radius: 980px; padding: 11px 24px; min-height: 44px;
    font-size: 17px; font-family: inherit;
    border: 1px solid var(--blue); background: transparent; color: var(--blue); }
  button.primary { background: var(--blue); border-color: transparent; color: #fff; }
</style>
</head>
<body>
<div class="card">
  <h1>Out of memory</h1>
  <p id="url"></p>
  <p>This tab was closed to protect the browser. Close a few tabs, then reload.</p>
  <div class="row">
    <button class="primary" id="retry">Reload tab</button>
  </div>
</div>
<script>
  const u = new URLSearchParams(location.search).get("u") || "";
  document.getElementById("url").textContent = u;
  document.getElementById("retry").addEventListener("click", () => {
    if (u) location.href = u;
  });
</script>
</body>
</html>
