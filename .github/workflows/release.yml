name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser Chromium (${{ matrix.os }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: --linux AppImage deb --config.npmRebuild=false
          - os: macos-latest
            args: --mac dmg --config.npmRebuild=false
          - os: windows-latest
            args: --win nsis --config.npmRebuild=false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts: @tailwindcss/oxide's postinstall crashes npm ci
      # (missing 'tar' at script time). Skipped scripts are either optional
      # (better-sqlite3 → JSON fallback) or fetched explicitly below.
      - name: Install deps
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Install Electron deps
        run: npm install -w apps/desktop-electron --include=optional --ignore-scripts

      # electron-builder needs the platform Electron dist, normally fetched
      # by the electron postinstall script we just skipped.
      - name: Fetch Electron dist
        run: node node_modules/electron/install.js

      - name: Build chrome
        run: npm run build:browser-chrome

      - name: Bundle
        uses: samuelmeuli/action-electron-builder@v1
        with:
          package_root: apps/desktop-electron
          github_token: ${{ secrets.github_token }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') }}
          args: ${{ matrix.args }}
        env:
          GH_TOKEN: ${{ secrets.github_token }}