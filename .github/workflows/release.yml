name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: continua-desktop/package-lock.json

      # Frontend deps + the Tauri CLI binary (bundled by @tauri-apps/cli).
      - name: Install frontend deps
        working-directory: continua-desktop
        run: npm ci --legacy-peer-deps

      # Ubuntu runners lack the WebKitGTK system libs Tauri compiles against.
      - name: Linux build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ./continua-desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Continua v__VERSION__"
          releaseBody: |
            Continua Browser — your workspace follows you.

            **Artifacts:** Linux `.deb` + `.AppImage`, macOS `.app` + `.dmg`,
            Windows `.msi` + `.nsis`.

            > Signing: macOS + Windows artifacts are unsigned until Apple
            > notarization and a Windows cert are added to repo secrets.
            > On first launch macOS will require right-click > Open.
            >
            > The backend URL defaults to `https://continuaos.cc`; point it at
            > your deployment any time via the palette: _Set Continua server
            > URL_ — no reinstall needed.
          args: --bundles ${{ matrix.bundles }}