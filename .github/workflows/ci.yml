name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-check:
    name: Shell (typecheck)
    runs-on: ubuntu-latest
    paths:
      - 'apps/shell/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: TypeScript
        working-directory: apps/shell
        run: npx tsc --noEmit

  shell-test:
    name: Shell (tests)
    runs-on: ubuntu-latest
    paths:
      - 'apps/shell/**'
      - 'package.json'
      - '.github/workflows/ci.yml'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Vitest
        working-directory: apps/shell
        run: npx vitest run --reporter=verbose
        env:
          CI: true

  desktop-check:
    name: Desktop (typecheck + vite build + rust tests)
    runs-on: ubuntu-22.04
    paths:
      - 'apps/desktop/**'
      - 'package.json'
      - '.github/workflows/ci.yml'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Frontend deps
        run: npm ci --legacy-peer-deps
      - name: TypeScript
        working-directory: apps/desktop
        run: npx tsc --noEmit
      - name: Vite build
        working-directory: apps/desktop
        run: npx vite build
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  build:
    name: Build shell
    runs-on: ubuntu-latest
    needs: [shell-check, shell-test]
    paths:
      - 'apps/shell/**'
      - 'package.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Next build
        working-directory: apps/shell
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          CAPABILITY_JWT_SECRET: ${{ secrets.CAPABILITY_JWT_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: nextjs-build
          path: apps/shell/.next
          retention-days: 7