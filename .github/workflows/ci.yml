name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The product's own test suite. This job did not exist before: 100+ host
  # tests were invisible to CI, and the one failure mode they cannot catch
  # (a module missing from electron-builder's `build.files`, which crashes the
  # packaged app on its first line) is asserted below.
  browser-host:
    name: Browser host (unit tests + syntax gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Host unit tests
        run: npm -w apps/desktop-electron run test
      - name: Syntax gate (module scope runs at require time)
        run: |
          node --check apps/desktop-electron/main.js
          node --check apps/desktop-electron/preload.js
          node --check apps/desktop-electron/mcp-browser.mjs
      - name: Every require() is packaged (packaged app must boot)
        run: node scripts/check-build-files.cjs
      - name: Chrome typecheck + build
        working-directory: apps/desktop
        run: npx tsc --noEmit && npx vite build

  # Frozen legacy Next.js host (ADR-009: backend-only). Red by design and
  # unrelated to the shipped browser — see ROADMAP.md blocker 2. Non-blocking
  # so it cannot hold up the product, but never silently ignored either.
  shell-check:
    name: Shell (typecheck, legacy — non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        working-directory: apps/shell
        run: npx tsc --noEmit

  shell-test:
    name: Shell (tests, legacy — non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Vitest
        working-directory: apps/shell
        run: npx vitest run --reporter=verbose
        env:
          CI: true

  desktop-check:
    name: Desktop (typecheck + vite build + rust tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Frontend deps
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        working-directory: apps/desktop
        run: npx tsc --noEmit
      - name: Vite build
        working-directory: apps/desktop
        run: npx vite build
      - name: Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo test
        working-directory: apps/desktop/src-tauri
        run: cargo test

  build:
    name: Build shell
    runs-on: ubuntu-latest
    needs: [browser-host]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund
      - name: Next build
        working-directory: apps/shell
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          CAPABILITY_JWT_SECRET: ${{ secrets.CAPABILITY_JWT_SECRET }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: nextjs-build
          path: apps/shell/.next
          retention-days: 7